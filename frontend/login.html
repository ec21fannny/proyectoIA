<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClariCopilot | Iniciar sesión</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/static/css/styles.css">
    <script src="/static/js/login.js" defer></script>
</head>

<body class="auth-page">
    <main class="auth-card">
        <a href="/login" class="brand brand-dark">
            <span class="brand-icon">C</span>
            <span>ClariCopilot</span>
        </a>
        <p class="subtitle">Te ayuda a entender qué tienes que hacer.</p>

        <div class="auth-tabs" role="tablist">
            <button id="loginTab" class="auth-tab active" role="tab"
                    aria-selected="true" type="button">Iniciar sesión</button>
            <button id="registerTab" class="auth-tab" role="tab"
                    aria-selected="false" type="button">Crear cuenta</button>
        </div>

        <form id="authForm" novalidate>
            <div id="nameField" class="field" hidden>
                <label for="nombre">Nombre</label>
                <input id="nombre" name="nombre" type="text" autocomplete="name">
            </div>

            <div class="field">
                <label for="email">Correo electrónico</label>
                <input id="email" name="email" type="email" autocomplete="email" required>
            </div>

            <div class="field">
                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password"
                       autocomplete="current-password" required minlength="8">
                <small id="passwordHint" class="help-text" hidden>Mínimo 8 caracteres.</small>
            </div>

            <p id="authError" class="form-error" role="alert" hidden></p>

            <button id="submitButton" class="button primary full" type="submit">
                Entrar →
            </button>
        </form>

        <p class="footer">ClariCopilot · Proyecto académico de Ingeniería
            en Sistemas Computacionales</p>
    </main>
</body>
</html>
